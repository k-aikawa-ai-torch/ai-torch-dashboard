<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI torch 予実管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,sans-serif;background:#FFFFFF;color:#14213D;min-height:100vh}
#lock-screen{position:fixed;inset:0;background:#14213D;display:flex;align-items:center;justify-content:center;z-index:9999}
#lock-box{background:#FFFFFF;border-radius:4px;padding:36px 40px;width:320px;text-align:center}
#lock-box h2{font-size:16px;font-weight:500;margin-bottom:6px}
#lock-box p{font-size:13px;color:#6B7A99;margin-bottom:20px}
#lock-box input{width:100%;height:40px;padding:0 14px;border:1px solid #DEE7F7;border-radius:4px;font-size:15px;margin-bottom:10px;background:#fff}
#lock-box input:focus{outline:none;border-color:#0D40D9}
#lock-box button{width:100%;height:40px;background:#14213D;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer}
#lock-error{color:#0D40D9;font-size:12px;margin-top:8px;min-height:18px}
#app{display:none}
.main{max-width:1200px;margin:0 auto;padding:16px}
.top-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 20px 0}
.top-strip h1{font-size:17px;font-weight:700;color:#14213D}
.badge{background:#fff;border:1px solid #DEE7F7;font-size:11px;padding:3px 10px;border-radius:20px;color:#6B7A99}
.member-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.member-tab{padding:6px 18px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #DEE7F7;color:#6B7A99;background:#fff}
.member-tab.active{background:#14213D;color:#fff;border-color:#14213D}
.sec-header{display:flex;align-items:center;gap:8px;margin:0 0 10px 2px}
.sec-header .bar{width:4px;height:16px;border-radius:2px}
.sec-header .title{font-size:16px;font-weight:500;color:#14213D}
.sec-header .sub{font-size:11px;color:#9aa3b8}
.section-block{border:1px solid #DEE7F7;border-radius:16px;padding:20px;margin-bottom:24px;background:#FAFBFE}
.hero-card{background:#fff;border:1px solid #DEE7F7;border-radius:16px;padding:1.5rem}
.hero-label{font-size:12px;color:#6B7A99;margin-bottom:6px}
.hero-value{font-family:'Shippori Mincho',serif;font-size:36px;font-weight:700;color:#14213D}
.other-rev-note{font-size:12px;color:#9aa3b8;margin-top:10px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:#6B7A99;font-weight:500}
.form-group input{height:36px;padding:0 10px;border:1px solid #DEE7F7;border-radius:8px;font-size:13px;background:#fff}
.btn-save{padding:0 20px;height:36px;background:#14213D;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.rev-table, .checklist-table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #DEE7F7}
.rev-table th, .checklist-table th{background:#f9f9f7;font-size:11px;font-weight:500;color:#6B7A99;padding:8px 10px;text-align:left;border-bottom:1px solid #DEE7F7;white-space:nowrap}
.rev-table td, .checklist-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.rev-table tr:last-child td, .checklist-table tr:last-child td{border-bottom:none}
.del-btn{background:none;border:none;color:#c00;cursor:pointer;font-size:12px}
.chk-cell{text-align:center}
.chk-cell.overdue{background:#FFF0F0}
.chk-label{font-size:9.5px;color:#9aa3b8;display:block;margin-bottom:2px}
.hire-date-input{height:26px;padding:0 4px;border:1px solid #DEE7F7;border-radius:4px;font-size:11px;width:110px}
.icon-btn{background:none;border:none;cursor:pointer;color:#6B7A99;font-size:14px;padding:4px}
</style>
<link rel="stylesheet" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/assets/shared.css">
</head>
<body>
<div id="lock-screen">
  <div id="lock-box">
    <h2>AI torch 予実管理</h2>
    <p>メールアドレスとパスワードでログイン</p>
    <input type="email" id="email-input" placeholder="メールアドレス">
    <input type="password" id="pw-input" placeholder="パスワード" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">ログイン</button>
    <div id="lock-error"></div>
  </div>
</div>

<div id="app">
  <nav class="app-sidebar">
    <a class="sb-logo" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/index.html"><img src="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/assets/torch-blue-circle.jpg" alt="AI torch"></a>
    <a class="sb-item" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/index.html"><span class="sb-icon">⌂</span><span class="sb-label">Home</span></a>
    <a class="sb-item" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/companies.html"><span class="sb-icon">◧</span><span class="sb-label">企業検索</span></a>
    <a class="sb-item" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/candidates.html"><span class="sb-icon">☰</span><span class="sb-label">候補者管理</span></a>
    <a class="sb-item" href="https://k-aikawa-ai-torch.github.io/ai-torch-company-search/pipeline.html"><span class="sb-icon">◎</span><span class="sb-label">パイプライン</span></a>
    <a class="sb-item" href="dashboard.html"><span class="sb-icon">▤</span><span class="sb-label">ダッシュボード</span></a>
    <a class="sb-item" href="kpi.html"><span class="sb-icon">📊</span><span class="sb-label">詳細KPI</span></a>
    <a class="sb-item active" href="financials.html"><span class="sb-icon">💰</span><span class="sb-label">予実管理</span></a>
    <div class="sb-spacer"></div>
    <div class="sb-item" onclick="doLogout()"><span class="sb-icon">⏻</span><span class="sb-label">ログアウト</span></div>
  </nav>
  <div class="app-body">
    <div class="top-strip">
      <h1>AI torch 予実管理</h1>
      <span class="badge" id="header-badge">読み込み中…</span>
    </div>
  <div class="main">
    <div class="member-tabs">
      <button class="member-tab active" onclick="setMember('全員',this)">全員</button>
      <button class="member-tab" onclick="setMember('相川',this)">相川</button>
      <button class="member-tab" onclick="setMember('永井',this)">永井</button>
      <button class="member-tab" onclick="setMember('會澤',this)">會澤</button>
    </div>
    <div id="content"><div style="text-align:center;padding:40px;color:#6B7A99">データを読み込み中…</div></div>
  </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vqunibhzmvlckqbydgea.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdW5pYmh6bXZsY2txYnlkZ2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzY0NTYsImV4cCI6MjA5NzgxMjQ1Nn0.t9_RIVPY1vrgGmxxFFYXP9uWxT7401ha4Flc9q0_zMA';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MEMBER_MAP = {'相川':'aikawa_kenta','永井':'nagai_yudai','會澤':'aizawa_yuma'};
const MEMBER_NAMES = {'aikawa_kenta':'相川','nagai_yudai':'永井','aizawa_yuma':'會澤'};
const ACCEPT_PHASES = ['内定承諾','入社待ち','入社済み'];

let MEMBERS = [], PIPELINE_DATA = [], CANDIDATE_DATA = [], PHASE_HISTORY = [], OTHER_REVENUE = [];
let currentMember = '全員';
let CURRENT_USER_EMAIL = null;
let ME = null;

async function doLogin() {
  const email = document.getElementById('email-input').value;
  const password = document.getElementById('pw-input').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('lock-error').textContent = 'メールアドレスまたはパスワードが違います'; return; }
  CURRENT_USER_EMAIL = email;
  showApp();
}
async function doLogout() { await sb.auth.signOut(); location.reload(); }
function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}
sb.auth.getSession().then(({ data: { session } }) => { if (session) { CURRENT_USER_EMAIL = session.user.email; showApp(); } });

async function fetchAllRange(table, select) {
  let all = [], from = 0;
  const size = 1000;
  while (true) {
    const { data, error } = await sb.from(table).select(select).range(from, from + size - 1);
    if (error || !data || data.length === 0) break;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}

async function loadData() {
  const [{ data: members }, { data: candidates }, pipeline, phaseHistory, { data: otherRevenue }] = await Promise.all([
    sb.from('members').select('*'),
    sb.from('candidates').select('*,members(name,display_name)'),
    fetchAllRange('pipeline', '*, members(name,display_name), candidates(name,revenue_forecast), companies(name)'),
    fetchAllRange('pipeline_phase_history', '*'),
    sb.from('other_revenue').select('*,members(name,display_name)').order('revenue_date', { ascending: false }),
  ]);

  MEMBERS = members || [];
  CANDIDATE_DATA = candidates || [];
  PIPELINE_DATA = pipeline || [];
  PHASE_HISTORY = phaseHistory || [];
  OTHER_REVENUE = otherRevenue || [];

  document.getElementById('header-badge').textContent = today().substring(0,7);
  ME = MEMBERS.find(m => m.email === CURRENT_USER_EMAIL);
  if (ME) {
    const myLabel = Object.keys(MEMBER_MAP).find(k => MEMBER_MAP[k] === ME.name);
    if (myLabel) {
      currentMember = myLabel;
      document.querySelectorAll('.member-tab').forEach(t => t.classList.toggle('active', t.textContent === myLabel));
    }
  }
  render();
}

function setMember(m, el) {
  currentMember = m;
  document.querySelectorAll('.member-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function filterByMemberName(arr, memberName) {
  if (memberName === '全員') return arr;
  const key = MEMBER_MAP[memberName];
  return arr.filter(x => x.members && x.members.name === key);
}

function today() { return new Date().toISOString().substring(0,10); }
function fmtSalary(v) { if (v==null) return '¥0'; return '¥' + Math.round(v).toLocaleString(); }

function firstOccurrenceMap(pipelineItems, phases) {
  const ids = new Set(pipelineItems.map(p => p.id));
  const map = {};
  PHASE_HISTORY.filter(h => ids.has(h.pipeline_id) && phases.includes(h.phase)).forEach(h => {
    if (!map[h.pipeline_id] || h.changed_at < map[h.pipeline_id]) map[h.pipeline_id] = h.changed_at;
  });
  return map;
}

function sumActualRevenueThisMonth(pipelineItems) {
  const month = today().substring(0,7);
  const map = firstOccurrenceMap(pipelineItems, ACCEPT_PHASES);
  const counted = new Set();
  let sum = 0;
  Object.keys(map).forEach(pid => {
    if (map[pid].substring(0,7) !== month) return;
    const p = pipelineItems.find(x => x.id === pid);
    if (!p || !p.candidate_id || counted.has(p.candidate_id)) return;
    counted.add(p.candidate_id);
    if (p.candidates?.revenue_forecast) sum += p.candidates.revenue_forecast;
  });
  return sum;
}

function sumOtherRevenueThisMonth(memberIds) {
  const month = today().substring(0,7);
  return OTHER_REVENUE.filter(r => r.revenue_date.substring(0,7) === month && (currentMember === '全員' || memberIds.includes(r.member_id)))
    .reduce((s,r) => s + (r.amount||0), 0);
}

function render() {
  const el = document.getElementById('content');
  const myPipeline = filterByMemberName(PIPELINE_DATA, currentMember);
  const memberIds = currentMember === '全員' ? MEMBERS.map(m=>m.id) : [MEMBERS.find(m=>m.name===MEMBER_MAP[currentMember])?.id];

  let html = '';

  // ===== 売上まとめ =====
  const recruitingRevenue = sumActualRevenueThisMonth(myPipeline);
  const otherRevenue = sumOtherRevenueThisMonth(memberIds);
  const total = recruitingRevenue + otherRevenue;

  html += '<div class="section-block">';
  html += '<div class="sec-header"><span class="bar" style="background:#0D40D9"></span><span class="title">今月の売上まとめ</span><span class="sub">' + today().substring(0,7) + '</span></div>';
  html += '<div class="hero-card">';
  html += '<div class="hero-label">合算売上（人材紹介＋その他）</div>';
  html += '<div class="hero-value">' + fmtSalary(total) + '</div>';
  html += '<div style="display:flex;gap:24px;margin-top:14px">';
  html += '<div><div class="hero-label">人材紹介売上</div><div style="font-size:20px;font-weight:600">' + fmtSalary(recruitingRevenue) + '</div></div>';
  html += '<div><div class="hero-label" style="color:#c0c5cf">その他売上</div><div style="font-size:14px;color:#9aa3b8">' + fmtSalary(otherRevenue) + '</div></div>';
  html += '</div></div></div>';

  // ===== その他売上入力 =====
  html += '<div class="section-block">';
  html += '<div class="sec-header"><span class="bar" style="background:#9aa3b8"></span><span class="title">人材紹介以外の売上</span><span class="sub">都度手入力・コンサル費用/顧問料など</span></div>';
  html += '<div class="form-row">';
  html += '<div class="form-group"><label>日付</label><input type="date" id="or-date" value="' + today() + '"></div>';
  html += '<div class="form-group"><label>金額（円）</label><input type="number" id="or-amount" placeholder="例: 300000"></div>';
  html += '<div class="form-group" style="flex:1;min-width:160px"><label>内容</label><input type="text" id="or-desc" placeholder="例: 〇〇社 顧問料 7月分"></div>';
  html += '<button class="btn-save" onclick="addOtherRevenue()">＋ 追加</button>';
  html += '</div>';
  html += renderOtherRevenueTable(memberIds);
  html += '</div>';

  // ===== 事務処理チェックリスト =====
  html += '<div class="section-block">';
  html += '<div class="sec-header"><span class="bar" style="background:#e24b4a"></span><span class="title">事務処理チェックリスト</span><span class="sub">内定承諾以降の案件</span></div>';
  html += renderChecklist(myPipeline);
  html += '</div>';

  el.innerHTML = html;
}

function renderOtherRevenueTable(memberIds) {
  const rows = OTHER_REVENUE.filter(r => currentMember === '全員' || memberIds.includes(r.member_id));
  if (!rows.length) return '<div style="color:#9aa3b8;font-size:12px">まだ登録がありません</div>';
  let html = '<table class="rev-table"><thead><tr><th>日付</th><th>担当</th><th>金額</th><th>内容</th><th></th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr><td>' + r.revenue_date + '</td><td>' + (r.members ? (r.members.display_name||MEMBER_NAMES[r.members.name]) : '-') + '</td><td>' + fmtSalary(r.amount) + '</td><td>' + (r.description||'-') + '</td>' +
      '<td><button class="del-btn" onclick="deleteOtherRevenue(\'' + r.id + '\')">削除</button></td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

async function addOtherRevenue() {
  const date = document.getElementById('or-date').value;
  const amount = parseFloat(document.getElementById('or-amount').value);
  const desc = document.getElementById('or-desc').value;
  if (!date || !amount) { alert('日付と金額を入力してください'); return; }
  const memberId = ME ? ME.id : (currentMember !== '全員' ? MEMBERS.find(m=>m.name===MEMBER_MAP[currentMember])?.id : null);
  const { error } = await sb.from('other_revenue').insert({ member_id: memberId, revenue_date: date, amount: amount, description: desc || null });
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const { data } = await sb.from('other_revenue').select('*,members(name,display_name)').order('revenue_date', { ascending: false });
  OTHER_REVENUE = data || [];
  render();
}

async function deleteOtherRevenue(id) {
  if (!confirm('削除してよいですか？')) return;
  const { error } = await sb.from('other_revenue').delete().eq('id', id);
  if (error) { alert('削除に失敗しました: ' + error.message); return; }
  OTHER_REVENUE = OTHER_REVENUE.filter(r => r.id !== id);
  render();
}

// ============ 事務処理チェックリスト ============
const CHECKLIST_ITEMS = [
  { key: 'checklist_contract_report', label: '成約報告', due: 'accept' },
  { key: 'checklist_candidate_followup', label: '人材フォロー', due: 'hire' },
  { key: 'checklist_invoice', label: '請求書発行', due: 'hire' },
  { key: 'checklist_company_confirm', label: '企業入社確認', due: 'hire' },
  { key: 'checklist_media_report', label: '媒体入社報告', due: 'hire' },
  { key: 'checklist_payment_confirm', label: '入金確認', due: 'payment' },
];

function lastDayOfNextMonth(hireDate) {
  const d = new Date(hireDate);
  const nextMonthLastDay = new Date(d.getFullYear(), d.getMonth() + 2, 0);
  return nextMonthLastDay.toISOString().substring(0,10);
}

function renderChecklist(pipelineItems) {
  const acceptMap = firstOccurrenceMap(pipelineItems, ACCEPT_PHASES);
  const targets = pipelineItems.filter(p => acceptMap[p.id]);
  if (!targets.length) return '<div style="color:#9aa3b8;font-size:12px">対象の案件がまだありません</div>';

  const todayStr = today();
  let html = '<table class="checklist-table"><thead><tr><th>候補者</th><th>企業</th><th>内定承諾日</th><th>入社日</th>';
  CHECKLIST_ITEMS.forEach(it => { html += '<th>' + it.label + '</th>'; });
  html += '</tr></thead><tbody>';

  targets.sort((a,b) => (acceptMap[b.id]||'').localeCompare(acceptMap[a.id]||''));

  targets.forEach(p => {
    const acceptDate = acceptMap[p.id] ? acceptMap[p.id].substring(0,10) : null;
    html += '<tr>';
    html += '<td><strong>' + (p.candidates?.name||'-') + '</strong></td>';
    html += '<td style="color:#6B7A99">' + (p.companies?.name||'-') + '</td>';
    html += '<td style="color:#6B7A99">' + (acceptDate||'-') + '</td>';
    html += '<td><input type="date" class="hire-date-input" value="' + (p.hire_date||'') + '" onchange="saveHireDate(\'' + p.id + '\',this.value)"></td>';

    CHECKLIST_ITEMS.forEach(it => {
      let dueDate = null;
      if (it.due === 'accept') dueDate = acceptDate;
      else if (it.due === 'hire') dueDate = p.hire_date;
      else if (it.due === 'payment') dueDate = p.hire_date ? lastDayOfNextMonth(p.hire_date) : null;
      const isDone = !!p[it.key];
      const isOverdue = !isDone && dueDate && dueDate < todayStr;
      html += '<td class="chk-cell' + (isOverdue ? ' overdue' : '') + '">' +
        (dueDate ? '<span class="chk-label">' + dueDate + '</span>' : '') +
        '<input type="checkbox" ' + (isDone ? 'checked' : '') + ' onchange="toggleChecklistItem(\'' + p.id + '\',\'' + it.key + '\',this.checked)">' +
        '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

async function saveHireDate(pipelineId, value) {
  const { error } = await sb.from('pipeline').update({ hire_date: value || null }).eq('id', pipelineId);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (p) p.hire_date = value || null;
  render();
}

async function toggleChecklistItem(pipelineId, key, checked) {
  const { error } = await sb.from('pipeline').update({ [key]: checked }).eq('id', pipelineId);
  if (error) { alert('保存に失敗しました: ' + error.message); return; }
  const p = PIPELINE_DATA.find(x => x.id === pipelineId);
  if (p) p[key] = checked;
  render();
}
</script>
</body>
</html>
